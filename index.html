<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI-Resistant Roadmaps</title>
  <meta name="description" content="Search a CS or Data Science role, see the skills employers ask for, and get an AI-resistant learning roadmap with verification challenges." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 22l7-12 7 12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='16' cy='21' r='2' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    // Apply theme before paint to avoid a flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem('air:theme'); } catch (e) {}
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { -webkit-font-smoothing: antialiased; }
    .grid-bg {
      background-image:
        linear-gradient(to right, rgb(100 116 139 / 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgb(100 116 139 / 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .fade-in { animation: fadeIn .35s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .spin { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .line-draw { stroke-dasharray: 6 6; animation: dash 30s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -600; } }
    .panel-scroll::-webkit-scrollbar { width: 8px; }
    .panel-scroll::-webkit-scrollbar-thumb { background: rgb(100 116 139 / .35); border-radius: 8px; }
    code.inline { font-family: 'JetBrains Mono', monospace; font-size: .85em; padding: .1em .35em; border-radius: .35em; background: rgb(99 102 241 / .12); }
    @media (prefers-reduced-motion: reduce) {
      .fade-in, .spin, .line-draw { animation: none !important; }
    }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans">
  <div class="min-h-full flex flex-col">
    <header class="sticky top-0 z-30 border-b border-slate-200/80 dark:border-slate-800/80 bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur">
      <div class="mx-auto max-w-7xl px-4 h-14 flex items-center justify-between gap-3">
        <a href="#/" class="flex items-center gap-2 font-semibold tracking-tight">
          <span class="grid place-items-center w-8 h-8 rounded-lg bg-indigo-600 text-white">
            <svg viewBox="0 0 32 32" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 22l7-12 7 12"/><circle cx="16" cy="21" r="1.5" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="hidden sm:inline">AI-Resistant <span class="text-indigo-600 dark:text-indigo-400">Roadmaps</span></span>
        </a>
        <nav class="flex items-center gap-1">
          <a href="#/roles?q=" class="px-3 py-1.5 rounded-lg text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-800">Browse roles</a>
          <a href="#/about" class="px-3 py-1.5 rounded-lg text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-800">Methodology</a>
          <button id="themeToggle" type="button" aria-label="Toggle dark mode" class="w-9 h-9 grid place-items-center rounded-lg text-slate-600 hover:bg-slate-200/60 dark:text-slate-300 dark:hover:bg-slate-800">
            <svg class="w-5 h-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="w-5 h-5 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </nav>
      </div>
    </header>

    <main id="app" class="flex-1"></main>

    <footer class="border-t border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-500">
      <div class="mx-auto max-w-7xl px-4 py-5 flex flex-col sm:flex-row gap-2 justify-between">
        <span>Built for CS &amp; Data Science students. Use AI as a tutor — then prove you can work without it.</span>
        <span>Posting data from public company job boards, refreshed weekly · <a href="#/about" class="underline underline-offset-2 hover:text-indigo-600">Methodology</a></span>
      </div>
    </footer>
  </div>

  <!-- Skill detail panel -->
  <div id="backdrop" class="fixed inset-0 z-40 bg-slate-950/40 backdrop-blur-[2px] opacity-0 pointer-events-none transition-opacity duration-300"></div>
  <aside id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"
    class="fixed z-50 bg-white dark:bg-slate-900 shadow-2xl border-slate-200 dark:border-slate-800 transition-transform duration-300 ease-out
           inset-x-0 bottom-0 max-h-[88vh] rounded-t-2xl border-t translate-y-full
           md:inset-y-0 md:right-0 md:left-auto md:w-[520px] md:max-h-none md:rounded-none md:border-t-0 md:border-l md:translate-y-0 md:translate-x-full
           flex flex-col">
  </aside>

  <script src="jobs-data.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
