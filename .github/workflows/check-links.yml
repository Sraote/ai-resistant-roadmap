name: Check learning-resource links

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 1" # Mondays 07:41 UTC
  push:
    branches: [main]
    paths: [resources.js]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_links.py resources.js
